<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShiftBoss</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050505; color: #F4F4F5; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #4ADE80; animation: blink 1.4s ease-in-out infinite; }
    p { margin: 0; color: rgba(255,255,255,.55); font-size: 13px; }
    @keyframes blink { 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main role="status">
    <span class="dot" aria-hidden="true"></span>
    <strong>Starting ShiftBoss…</strong>
    <p id="msg">Reading your sessions from herdr.</p>
  </main>
</body>
</html>
